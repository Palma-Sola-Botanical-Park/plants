<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palma Sola Botanical Park</title>
<style>
  :root{
    --bg:#0f2418; --card:#1d3f2a; --line:#2c5238;
    --text:#eef6ee; --muted:#a8c6b0; --accent:#8ad98a; --link:#aecbff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:16px; min-height:100vh;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:660px; padding:24px 24px 44px;}

  header{display:flex; align-items:center; justify-content:space-between; gap:18px;
    padding-bottom:16px; border-bottom:1px solid var(--line);}
  .titles h1{font-size:24px; margin:0; letter-spacing:.2px;}
  .titles .sub{color:var(--muted); font-size:13.5px; margin-top:3px;}
  .logo{width:138px; height:auto; flex:0 0 auto;
    filter:drop-shadow(0 2px 7px rgba(0,0,0,.45));}

  .total{text-align:center; margin:22px 0 4px;}
  .total .n{font-size:68px; font-weight:800; color:var(--accent); line-height:1;
    font-variant-numeric:tabular-nums;}
  .total .cap{color:var(--muted); font-size:14px; margin-top:5px;}

  .cards{display:flex; gap:11px; margin:20px 0 8px;}
  .card{flex:1; background:var(--card); border-radius:14px; padding:15px 6px; text-align:center;}
  .card .n{font-size:31px; font-weight:800; font-variant-numeric:tabular-nums;}
  .card .cap{color:var(--muted); font-size:13px; margin-top:4px;}
  .basis{text-align:center; color:var(--muted); font-size:13px; margin-top:10px;}
  .basis button{background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:4px 10px; font-size:12.5px; cursor:pointer; margin-left:5px;}
  .basis button.on{background:var(--accent); color:#0f2418; border-color:var(--accent); font-weight:700;}

  hr{border:none; border-top:1px solid var(--line); margin:24px 0 16px;}

  .latest h2{font-size:16px; color:var(--accent); text-align:center; margin:0 0 2px;}
  .latest .h2sub{text-align:center; color:var(--muted); font-size:12px; margin-bottom:14px;}
  .obs{display:flex; gap:18px; align-items:flex-start;}
  .obs .photo img{width:250px; max-width:100%; border-radius:14px; display:block;}
  .obs .photo .none{color:var(--muted); font-size:13px; padding:24px; text-align:center;}
  .obs .info{flex:1; min-width:0;}
  .info .species{font-size:23px; font-weight:800; margin:0 0 2px;}
  .info .sci{font-style:italic; color:var(--muted); font-size:15px; margin-bottom:10px;}
  .info .meta{font-size:14.5px; color:var(--text); line-height:1.7;}
  .info .meta b{color:var(--accent); font-weight:600;}
  .info .viewlink{margin-top:12px;}
  .info .viewlink a{color:var(--link); text-decoration:none; font-size:14px;}
  .info .viewlink a:hover{text-decoration:underline;}

  .fact{margin-top:20px; background:var(--card); border-left:4px solid var(--accent);
    border-radius:12px; padding:16px 18px; display:none;}
  .fact h3{margin:0 0 8px; font-size:12.5px; letter-spacing:.7px;
    text-transform:uppercase; color:var(--accent);}
  .fact p{margin:0; font-size:15.5px; line-height:1.65;}
  .fact .attr{display:block; margin-top:11px; font-size:11.5px; color:var(--muted);}
  .fact .attr a{color:var(--link); text-decoration:none;}

  footer{display:flex; align-items:center; justify-content:space-between; margin-top:28px;}
  .status{color:var(--muted); font-size:12.5px;}
  .refresh{background:var(--accent); color:#0f2418; border:none; border-radius:10px;
    padding:9px 17px; font-size:13.5px; font-weight:700; cursor:pointer;}
  .refresh:active{opacity:.8;}
  .err{color:#ffb4a8; font-size:13.5px; text-align:center; margin-top:10px;}

  @media (max-width:560px){
    header{flex-direction:column-reverse; gap:12px; text-align:center;}
    .titles{text-align:center;}
    .logo{width:160px;}
    .obs{flex-direction:column; align-items:center;}
    .obs .photo img{width:100%;}
    .info{text-align:center;}
  }
</style>
</head>

  </header>

  <div class="total">
    <div class="n" id="total">...</div>
    <div class="cap">total observations</div>
  </div>

  <div class="cards">
    <div class="card"><div class="n" id="week">...</div><div class="cap">Past week</div></div>
    <div class="card"><div class="n" id="day">...</div><div class="cap">Past day</div></div>
    <div class="card"><div class="n" id="hour">...</div><div class="cap">Past hour</div></div>
  </div>
  <div class="basis">
    week / day / hour counted by:
    <button id="btnAdded" class="on">date added</button>
    <button id="btnObserved">date observed</button>
  </div>

  <hr>

  <div class="latest">
    <h2>Most recent observation</h2>
    <div class="h2sub">newest upload to the project</div>
    <div class="obs">
      <div class="photo" id="photo"></div>
      <div class="info">
        <div class="species" id="species">Loading...</div>
        <div class="sci" id="sciName"></div>
        <div class="meta" id="meta"></div>
        <div class="viewlink" id="viewlink"></div>
      </div>
    </div>
    <div class="fact" id="fact">
      <h3>About this species</h3>
      <p id="factText"></p>
      <span class="attr" id="factAttr"></span>
    </div>
  </div>

  <div class="err" id="err"></div>

  <footer>
    <span class="status" id="status">Starting...</span>
    <button class="refresh" id="refreshBtn">Refresh now</button>
  </footer>
</div>

<script>
  // ---- Settings ---------------------------------------------------------
  const PROJECT = "palma-sola-botanical-park";   // your exact project (from its URL)
  const API = "https://api.inaturalist.org/v1/observations";
  const TAXA = "https://api.inaturalist.org/v1/taxa/";
  const REFRESH_SECONDS = 60;
  let basis = "created";   // "created" = date added, "observed" = date made in the field

  const $ = id => document.getElementById(id);
  const comma = n => Number(n).toLocaleString();

  // Always fetch fresh - bust the browser cache
  async function getJSON(url){
    const r = await fetch(url + "&_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("iNaturalist returned " + r.status);
    return r.json();
  }

  function ago(iso){
    if(!iso) return "";
    const secs = (Date.now() - new Date(iso).getTime())/1000;
    if (secs < 90) return "just now";
    const mins = secs/60;
    if (mins < 90) return Math.round(mins) + " minutes ago";
    const hours = mins/60;
    if (hours < 36) return Math.round(hours) + " hours ago";
    return Math.round(hours/24) + " days ago";
  }

  function stripHtml(html){
    const d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }
  function clampText(s, max){
    if (!s) return "";
    if (s.length <= max) return s;
    let cut = s.slice(0, max);
    const i = cut.lastIndexOf(". ");
    return (i > 150) ? cut.slice(0, i + 1) : (cut.trim() + "...");
  }

  async function count(sinceMs){
    let url = API + "?project_id=" + PROJECT + "&per_page=0";
    if (sinceMs != null){
      const iso = new Date(Date.now() - sinceMs).toISOString();
      url += "&" + (basis === "observed" ? "d1" : "created_d1") + "=" + encodeURIComponent(iso);
    }
    const j = await getJSON(url);
    return j.total_results || 0;
  }
  async function latest(){
    const url = API + "?project_id=" + PROJECT + "&order_by=created_at&order=desc&per_page=1";
    const j = await getJSON(url);
    return (j.results && j.results[0]) || null;
  }

  // Live "about this species" blurb (from the species' Wikipedia summary on iNaturalist)
  const factCache = {};
  async function showFact(taxon){
    const box = $("fact");
    if (!taxon || !taxon.id){ box.style.display = "none"; return; }
    box.style.display = "block";
    $("factText").textContent = "Looking up a fact...";
    $("factAttr").innerHTML = "";
    let data = factCache[taxon.id];
    if (data === undefined){
      try{
        const j = await getJSON(TAXA + taxon.id + "?");
        const r = j.results && j.results[0];
        data = { sum: r && r.wikipedia_summary ? stripHtml(r.wikipedia_summary) : "",
                 url: (r && r.wikipedia_url) || "" };
      } catch(e){ data = { sum:"", url:"" }; }
      factCache[taxon.id] = data;
    }
    if (data.sum){
      box.style.display = "block";
      $("factText").textContent = clampText(data.sum, 380);
      $("factAttr").innerHTML = data.url
        ? ('via <a href="' + data.url + '" target="_blank" rel="noopener">Wikipedia</a>')
        : "via Wikipedia";
    } else {
      box.style.display = "none";
    }
  }

  // ---- Update -----------------------------------------------------------
  let busy = false;
  async function update(){
    if (busy) return;
    busy = true;
    $("err").textContent = "";
    $("status").textContent = "Updating...";
    const DAY = 86400000, HOUR = 3600000;
    try{
      const [total, week, day, hour, last] = await Promise.all([
        count(null), count(7*DAY), count(DAY), count(HOUR), latest()
      ]);
      $("total").textContent = comma(total);
      $("week").textContent  = comma(week);
      $("day").textContent   = comma(day);
      $("hour").textContent  = comma(hour);

      if (last){
        const t = last.taxon || {};
        const common = (t.preferred_common_name || "").trim();
        const sci = (t.name || "").trim();
        const user = (last.user && (last.user.name || last.user.login)) || "someone";
        $("species").textContent = common || sci || "Unknown species";
        $("sciName").textContent = (common && sci) ? sci : "";

        const obs = last.observed_on_string || last.observed_on || "";
        const lines = ["by <b>" + user + "</b>"];
        if (obs) lines.push("Observed: " + obs);
        const when = ago(last.created_at);
        if (when) lines.push("Added to project: " + when);
        $("meta").innerHTML = lines.join("<br>");

        const link = last.uri || ("https://www.inaturalist.org/observations/" + last.id);
        $("viewlink").innerHTML = '<a href="' + link + '" target="_blank" rel="noopener">View on iNaturalist &rarr;</a>';

        const photos = last.photos || [];
        if (photos.length && photos[0].url){
          $("photo").innerHTML = '<img src="' + photos[0].url.replace("square","medium") + '" alt="latest observation photo">';
        } else {
          $("photo").innerHTML = '<div class="none">(no photo for this one)</div>';
        }

        showFact(t);   // fills the fact box on its own
      } else {
        $("species").textContent = "No observations yet";
        $("sciName").textContent = "";
        $("meta").textContent = "";
        $("photo").innerHTML = "";
        $("viewlink").innerHTML = "";
        $("fact").style.display = "none";
      }

      const now = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'});
      $("status").textContent = "Updated " + now;
    } catch (e){
      $("status").textContent = "Couldn't update";
      $("err").innerHTML = "Couldn't reach iNaturalist (" + e.message + ").<br>" +
        'Check your internet, or open <a href="https://www.inaturalist.org/projects/' + PROJECT +
        '" target="_blank" rel="noopener" style="color:var(--link)">your project page</a> directly.';
    } finally {
      busy = false;
    }
  }

  $("refreshBtn").addEventListener("click", update);
  $("btnAdded").addEventListener("click", () => setBasis("created"));
  $("btnObserved").addEventListener("click", () => setBasis("observed"));
  function setBasis(b){
    basis = b;
    $("btnAdded").classList.toggle("on", b === "created");
    $("btnObserved").classList.toggle("on", b === "observed");
    update();
  }

  update();
  setInterval(update, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
